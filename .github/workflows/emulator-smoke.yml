name: Проверка на эмуляторе

# Запускается только вручную (Actions → Проверка на эмуляторе → Run workflow), на каждый коммит не работает.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Включить аппаратное ускорение эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Собрать и запустить приложение на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :app:installDebug --no-daemon
            adb shell monkey -p com.pocketcode -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof com.pocketcode
            adb logcat -d -s AndroidRuntime:E | tee crash.log
            ! grep -q "FATAL EXCEPTION" crash.log
